[package]
name = "luks-hwid"
description = "Keyscript initramfs : déverrouillage LUKS par empreinte matérielle (k parmi n), pour machines sans TPM"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "luks-hwid"
path = "src/main.rs"

[dependencies]
luks-hwid-core = { path = "../luks-hwid-core" }
clap = { version = "4", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rpassword = "7"
serde_json = "1"
thiserror = "2"
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libcryptsetup-rs = { version = "0.16", optional = true }
either = { version = "1", optional = true }

[features]
# Build "système" (glibc) : enroll/status passent par libcryptsetup.
# Build keyscript musl statique : --no-default-features, le chemin de boot
# n'utilise que le binaire cryptsetup déjà présent dans l'initramfs.
default = ["native-luks"]
native-luks = ["dep:libcryptsetup-rs", "dep:either"]
